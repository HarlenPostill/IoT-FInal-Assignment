services:
  mock-microphone:
    image: python:3.13-alpine
    restart: unless-stopped
    environment:
      LAB_GROUP_ID: ${LAB_GROUP_ID}
      MOCK_CONFIG_DIR: /config
    command: ["python", "-u", "/app/mock_microphone/server.py"]
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ../tools:/app:ro
      - ../include/cabinet_config.h:/config/cabinet_config.h:ro
      - ../include/noise_config.h:/config/noise_config.h:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/api/status', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
  influxdb:
    image: influxdb:2.7.12
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:?Run python3 tools/configure_cloud.py --local first}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
  telegraf:
    image: telegraf:1.36.1
    restart: unless-stopped
    env_file: .env
    environment:
      INFLUX_URL: http://influxdb:8086
    depends_on:
      influxdb:
        condition: service_healthy
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    env_file: .env
    environment:
      INFLUX_URL: http://influxdb:8086
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
